version: '3.8'

services:
  agent-env:
    build: .
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
      - cache-data:/root/.cache  # NEW: Preserve LLM summary cache

  # NEW: PostgreSQL for RAG agent
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DATABASE__POSTGRES_DATABASE}
      POSTGRES_USER: ${DATABASE__POSTGRES_USER}
      POSTGRES_PASSWORD: ${DATABASE__POSTGRES_PASSWORD}
    ports:
      - "${DATABASE__POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # NEW: Milvus vector DB for RAG agent
  milvus:
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus

volumes:
  postgres-data:
  milvus-data:
  cache-data: