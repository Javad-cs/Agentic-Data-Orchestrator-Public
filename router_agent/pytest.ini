[pytest]
# Pytest configuration for router_agent

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Async support
asyncio_mode = auto

# Markers for selective test runs
markers =
    unit: Unit tests (single component, fast)
    integration: Integration tests (multiple components, medium speed)
    e2e: End-to-end tests (full system, slow)
    slow: Slow tests (skip with -m "not slow")
    requires_llm: Tests that call real LLM APIs (skip with -m "not requires_llm")
    requires_db: Tests that need database connection

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Logging
log_cli = true
log_cli_level = INFO